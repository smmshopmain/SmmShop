name: Process scheduled email campaigns

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: email-campaign-delivery
  cancel-in-progress: false

jobs:
  process-campaigns:
    runs-on: ubuntu-latest
    steps:
      - name: Process due email campaign batches
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "::error::Set the BACKEND_URL Actions variable to the deployed backend URL."
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Set the CRON_SECRET Actions secret to match the Render backend's CRON_SECRET."
            exit 1
          fi
          for batch in 1 2 3 4 5 6; do
            response=$(curl --fail --silent --show-error --retry 2 --retry-delay 5 --connect-timeout 20 --max-time 90 \
              --request POST \
              --header "x-cron-secret: $CRON_SECRET" \
              "${BACKEND_URL%/}/api/cron/email-campaigns")
            echo "$response"
            if ! echo "$response" | jq -e '.data.processed == true' >/dev/null; then
              break
            fi
          done
