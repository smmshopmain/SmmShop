services:
  - type: web
    name: smm-panel
    runtime: node
    plan: free
    buildCommand: |
      if [ -d backend ] && cd backend; then
        npm ci && npm run build
      elif [ -d ../backend ] && cd ../backend; then
        npm ci && npm run build
      elif [ -d ../../backend ] && cd ../../backend; then
        npm ci && npm run build
      else
        echo "Could not locate backend package directory" >&2
        exit 1
      fi
    startCommand: |
      if [ -d backend ] && cd backend; then
        npm run start
      elif [ -d ../backend ] && cd ../backend; then
        npm run start
      elif [ -d ../../backend ] && cd ../../backend; then
        npm run start
      else
        echo "Could not locate backend package directory" >&2
        exit 1
      fi
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: PROVIDER_API_URL
        sync: false
      - key: PROVIDER_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: PAYMENT_WEBHOOK_SECRET
        sync: false
      - key: PAYMENT_VERIFY_API_URL
        sync: false
      - key: PAYMENT_VERIFY_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_ADMIN_ID
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: FROM_EMAIL
        sync: false
  - type: cron
    name: smm-keep-alive
    runtime: node
    schedule: "*/10 * * * *"
    buildCommand: |
      if [ -d backend ] && cd backend; then
        npm ci
      elif [ -d ../backend ] && cd ../backend; then
        npm ci
      elif [ -d ../../backend ] && cd ../../backend; then
        npm ci
      else
        echo "Could not locate backend package directory" >&2
        exit 1
      fi
    startCommand: |
      if [ -d backend ] && cd backend; then
        node -e "fetch(\"${process.env.APP_BASE_URL}/api/keep-alive\").then(async r => { console.log(await r.text()); if (!r.ok) process.exit(1); })"
      elif [ -d ../backend ] && cd ../backend; then
        node -e "fetch(\"${process.env.APP_BASE_URL}/api/keep-alive\").then(async r => { console.log(await r.text()); if (!r.ok) process.exit(1); })"
      elif [ -d ../../backend ] && cd ../../backend; then
        node -e "fetch(\"${process.env.APP_BASE_URL}/api/keep-alive\").then(async r => { console.log(await r.text()); if (!r.ok) process.exit(1); })"
      else
        echo "Could not locate backend package directory" >&2
        exit 1
      fi
    envVars:
      - key: APP_BASE_URL
        sync: false
  - type: cron
    name: smm-nightly-catalog-refresh
    runtime: node
    schedule: "30 18 * * *"
    buildCommand: |
      if [ -d backend ] && cd backend; then
